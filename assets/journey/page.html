</style></head><body>
<div id="root"></div><div id="labels"></div><svg id="fg" width="1920" height="1080"></svg>

<script type="module">

{ const g = new THREE.BufferGeometry(), n = 2500, p = new Float32Array(n * 3); let s = 7; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647); for (let i = 0; i < n; i++) { const v = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize().multiplyScalar(150); p.set([v.x, v.y, v.z], i * 3); } g.setAttribute("position", new THREE.BufferAttribute(p, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9fb4d8, size: 0.35 }))); }

  if (e.kind === "equator") { const pts = []; for (let i = 0; i <= 256; i++) pts.push(ll(0, -180 + (i / 256) * 360, R0 * 1.003)); const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color: 0x8a96ad, dashSize: 0.08, gapSize: 0.06, transparent: true, opacity: k })); l.computeLineDistances(); fx.add(l); }
