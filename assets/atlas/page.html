<script type="module">

const W = 1920, H = 1080, R0 = 4;
const C = { yellow: "#ffd166", red: "#ff6b6b", blue: "#5fb3ff", orange: "#ffb070", grey: "#8a96ad", green: "#7bd389", white: "#e8eef9" };

const clamp = (x) => Math.min(1, Math.max(0, x)), ease = (t) => (1 - Math.cos(Math.PI * clamp(t))) / 2;
const esc = (t) => String(t).replaceAll("&", "&amp;").replaceAll("<", "&lt;");

const NOISE = `float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

const slab = (cam, v, html, style = "") => { const [x, y] = project(cam, v); return `<div class="slab" style="left:${x}px;top:${y}px;${style}">${html}</div>`; };
const canvasTex = (w, h, draw) => { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };

// ---------- the globe ----------
const globe = (() => {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x010309); stars(scene);

})();
{ const land = await fetch("land-50m.json").then((r) => r.json());
  const TW = 8192, TH = 4096; const tex = canvasTex(TW, TH, (g) => {
    const sea = g.createLinearGradient(0, 0, 0, TH); sea.addColorStop(0, "#0a1a33"); sea.addColorStop(0.5, "#0e2547"); sea.addColorStop(1, "#0a1a33"); g.fillStyle = sea; g.fillRect(0, 0, TW, TH);
    const X = (lon) => (lon + 180) / 360 * TW, Y = (lat) => (90 - lat) / 180 * TH, path = new Path2D();
    for (const f of topojson.feature(land, land.objects.land).features) { const polys = f.geometry.type === "Polygon" ? [f.geometry.coordinates] : f.geometry.coordinates;
      for (const poly of polys) for (const ring of poly) { ring.forEach(([lo, la], i) => { if (!i || Math.abs(lo - ring[i - 1][0]) > 180) path.moveTo(X(lo), Y(la)); else path.lineTo(X(lo), Y(la)); }); path.closePath(); } }
    g.fillStyle = "#1b2b44"; g.fill(path, "evenodd"); g.strokeStyle = "rgba(160,190,230,0.85)"; g.lineWidth = 2.2; g.stroke(path);
    g.strokeStyle = "rgba(120,150,200,0.10)"; g.lineWidth = 1.5; for (let lo = -180; lo <= 180; lo += 15) { g.beginPath(); g.moveTo(X(lo), 0); g.lineTo(X(lo), TH); g.stroke(); } for (let la = -75; la <= 75; la += 15) { g.beginPath(); g.moveTo(0, Y(la)); g.lineTo(TW, Y(la)); g.stroke(); } });
  tex.anisotropy = 8;
  globe.scene.add(new THREE.Mesh(new THREE.SphereGeometry(R0, 192, 128), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 })));
  globe.scene.add(new THREE.Mesh(new THREE.SphereGeometry(R0 * 1.04, 96, 64), new THREE.ShaderMaterial({ transparent: true, side: THREE.BackSide, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: "varying vec3 n; void main(){ n = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
    fragmentShader: "varying vec3 n; void main(){ float i = pow(0.72 - dot(n, vec3(0,0,1.0)), 3.0); gl_FragColor = vec4(0.30,0.60,1.0,1.0)*i*1.3; }" }))); }
const GLOW = { red: [255, 90, 70], blue: [70, 160, 255], orange: [255, 160, 70], yellow: [255, 209, 102], grey: [140, 150, 170], green: [123, 211, 137], white: [230, 238, 249] };
const glowTex = {}; const glowMap = (c) => glowTex[c] ||= canvasTex(256, 256, (x) => { const [r, g, b] = GLOW[c]; const gr = x.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, `rgba(${r},${g},${b},0.9)`); gr.addColorStop(0.5, `rgba(${r},${g},${b},0.3)`); gr.addColorStop(1, "rgba(0,0,0,0)"); x.fillStyle = gr; x.fillRect(0, 0, 256, 256); });
const globeStorm = stormMat();
function drawGlobe(st) {
  const { scene, cam, sun, ll, fx } = globe;
  while (fx.children.length) { const c = fx.children.pop(); c.traverse?.((o) => o.geometry?.dispose?.()); }
  const onSurface = (m, lat, lon, h = 1.004) => { const p = ll(lat, lon, R0 * h); m.position.copy(p); m.lookAt(p.clone().multiplyScalar(2)); fx.add(m); return m; };
  const curve = (a, b, lift) => { const pa = ll(a[0], a[1], R0 * 1.012), pb = ll(b[0], b[1], R0 * 1.012); lift = 1 + (lift - 1) * Math.min(1, pa.angleTo(pb) / 0.6); return new THREE.QuadraticBezierCurve3(pa, pa.clone().add(pb).multiplyScalar(0.5).normalize().multiplyScalar(R0 * lift), pb); };

    if (e.kind === "band") { fx.add(new THREE.Mesh(new THREE.SphereGeometry(R0 * 1.002, 128, 64, 0, Math.PI * 2, THREE.MathUtils.degToRad(90 - e.to), THREE.MathUtils.degToRad(e.to - e.from)), new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.07 * k, depthWrite: false })));
      for (const lat of [e.from, e.to]) { const pts = []; for (let i = 0; i <= 256; i++) pts.push(ll(lat, -180 + (i / 256) * 360, R0 * 1.003)); fx.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.7 * k }))); } }
    if (e.kind === "equator") { const pts = []; for (let i = 0; i <= 256; i++) pts.push(ll(0, -180 + (i / 256) * 360, R0 * 1.003)); const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color: 0x8a96ad, dashSize: 0.08, gapSize: 0.06, transparent: true, opacity: k })); l.computeLineDistances(); fx.add(l); }

    const [x, y] = project(cam, p3); if (x < 40 || x > edge || y < 120 || y > H - 120) return;
    const width = pin.text.length * 16 + 30, fitsRight = x + 130 + width <= edge, fitsLeft = x - 130 - width >= 60;
    const right = fitsRight && fitsLeft ? x < W * 0.55 : fitsRight || (!fitsLeft && edge - x > x);
    const left = Math.max(60, Math.min(edge - width, right ? x + 130 : x - 130 - width));
    let dy = [-120, 80, -40, 150][i % 4];
    const clash = (top) => placed.some((b) => left < b.right && left + width > b.left && top < b.bottom && top + 46 > b.top) || (left < 1000 && top + 46 > H - 260);
    for (let tries = 0; tries < 12 && (clash(y + dy - 22) || y + dy < 150 || y + dy > H - 140); tries += 1) dy += y + dy > H - 300 ? -56 : 56;
    placed.push({ left, right: left + width, top: y + dy - 22, bottom: y + dy + 24 });

    html += `<div class="lab" style="opacity:${pin.k};left:${left}px;top:${y + dy - 22}px;width:${width}px;text-align:${right ? "left" : "right"}">${esc(pin.text)}</div>`; });

// ---------- 3D scenes ----------
const stage = (bg = 0x02050c) => { const scene = new THREE.Scene(); scene.background = new THREE.Color(bg); scene.fog = new THREE.Fog(bg, 26, 64);
  scene.add(new THREE.AmbientLight(0x6a85b0, 0.5)); const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(-8, 14, 10); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16 }); scene.add(key);

    scene.add(new THREE.AmbientLight(0x6a85b0, 0.6)); const sun = new THREE.DirectionalLight(0xfff1dd, 2.4); sun.position.set(-10, 14, 8); scene.add(sun);
    const sea = new THREE.Mesh(new THREE.CircleGeometry(34, 96), new THREE.ShaderMaterial({ uniforms: { uT: { value: 0 } }, vertexShader: "varying vec2 v; void main(){ v = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
      fragmentShader: `varying vec2 v; uniform float uT; ${NOISE} void main(){ vec2 c = v - 0.5; float r = length(c); float w = fbm(v*44.0 + vec2(uT*0.05, uT*0.03));

    const decks = []; for (let i = 0; i < 6; i++) { const m = stormMat(); m.uniforms.uEye.value = 0.22; const d = new THREE.Mesh(new THREE.CircleGeometry(9.5 - i * 0.5, 96), m); d.rotation.x = -Math.PI / 2; d.position.y = 5.6 + i * 0.22; scene.add(d); decks.push(d); }
    const eye = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 0.9, 6.2, 48, 1, true), new THREE.MeshBasicMaterial({ color: 0xff7a50, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false })); eye.position.y = 3.1; scene.add(eye);
    const wall = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 1.6, 5.6, 64, 1, true), new THREE.MeshStandardMaterial({ color: 0xdfe7f4, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false })); wall.position.y = 2.9; scene.add(wall);
